## ========================================
#  Base de donn�es (Configuration)
## ========================================
spring.application.name=agenceEvenementielle
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/event_management_db}
spring.datasource.username=${DB_USERNAME:event_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#pour �viter la strat�gie de nommage avec tiret bas
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

## ========================================
#  SMTP Gmail  (Configuration)
## ========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


## ===================================================================
#  JWT (Configuration)
## ====================================================================

# cl� secret
jwt.secret=${JWT_SECRET}
# 24 heures en ms (86400000 ms = 1 jour)
jwt.expiration=${JWT_EXPIRATION:86400000}

## ========================================
#  Logs (Configuration)
## ========================================
logging.file.name=logs/application.log
#Niveau de logs
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.tn.weeding.agenceevenementielle=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}

# Format des logs dans le fichier
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Rotation automatique des logs
# Cr�e un nouveau fichier quand il atteint 10MB
logging.logback.rollingpolicy.max-file-size=10MB
# Garde maximum 5 fichiers de logs
logging.logback.rollingpolicy.max-history=5

# Taille totale maximum des logs : 50MB
logging.logback.rollingpolicy.total-size-cap=50MB


## ========================================
#  SWAGGER (Configuration)
## ========================================
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha




# ========================================
# Google OAuth2 Configuration
# ========================================

# Client ID (r�cup�r� depuis Google Cloud Console)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

# Client Secret (r�cup�r� depuis Google Cloud Console)
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Scopes : informations demand�es � Google
spring.security.oauth2.client.registration.google.scope=profile,email

# URL de redirection apr�s authentification Google
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/api/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.registration.google.client-name=Google

# Provider Google (configuration automatique par Spring Boot)
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Taille maximale du fichier � televerser
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=${CACHE_SPEC:maximumSize=500,expireAfterWrite=30m}

# pour afficher les images en local et en docker 
spring.web.resources.static-locations=${STATIC_LOCATIONS:file:uploads/,file:/app/uploads/,classpath:/static/}


# URL du frontend (valeur par defaut pour local)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# cle OpenRouter pour assistant manager
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.model=${OPENROUTER_MODEL:deepseek/deepseek-v4-flash}
